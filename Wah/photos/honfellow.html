<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Honorary Fellowship Photos</title>

    <style>
        /* Page container (controls overall width) */
        .container {
            max-width: 700px;   /* adjust to your frame width */
            margin: 0 auto;
            font-family: Arial, sans-serif;
        }

        h3 {
            margin-bottom: 15px;
        }

        /* Remove default bullet styling */
        ul.photo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Each photo block */
        ul.photo-list li {
            margin-bottom: 25px;
        }

        /* Image scaling (KEY FIX) */
        ul.photo-list img {
            max-width: 100%;   /* prevents overflow */
            height: auto;      /* keeps correct aspect ratio */
            display: block;
            border-radius: 4px;
        }

        /* Caption styling */
        .caption {
            margin-top: 6px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">
    <h3>Photos</h3>

    <ul class="photo-list">

        <li>
            <a href="honfellow/01-9.jpg" target="_blank">
                <img src="honfellow/01-9.jpg" alt="Group picture">
            </a>
            <div class="caption">
                Group picture of the four Honorary Fellows and University leaders
            </div>
        </li>

        <li>
            <a href="honfellow/02-11.jpg" target="_blank">
                <img src="honfellow/02-11.jpg" alt="Award Ceremony">
            </a>
            <div class="caption">
                The Award Ceremony
            </div>
        </li>

        <li>
            <a href="honfellow/05-6-rotated.jpg" target="_blank">
                <img src="honfellow/05-6-rotated.jpg" alt="Receiving Award">
            </a>
            <div class="caption">
                Prof. Wah receiving the Award
            </div>
        </li>

        <li>
            <a href="honfellow/07-4.jpg" target="_blank">
                <img src="honfellow/07-4.jpg" alt="Acceptance speech">
            </a>
            <div class="caption">
                Prof. Wah delivering the acceptance speech on behalf of the four Honorary Fellows of 2026
            </div>
        </li>

    </ul>
</div>

</body>
</html>
